  <path class="edge" d="M309,186 V236" marker-end="url(#ah)"/>
  <path class="edge" d="M500,186 V236" marker-end="url(#ah)"/>
  <path class="edge" d="M691,186 V236" marker-end="url(#ah)"/>
  <path class="edge" d="M882,186 V236" marker-end="url(#ah)"/>
  <text class="elbl" x="317" y="224">pickle.dump</text>
  <text class="elbl" x="699" y="224">best test R² 0.85</text>

  <rect class="b-gray" x="227" y="240" width="164" height="56" rx="10"/>
  <text class="lbl mono" x="309" y="263" text-anchor="middle">encoder.pkl</text>
  <text class="note" x="309" y="282" text-anchor="middle">one-hot of 4 columns</text>

  <rect class="b-gray" x="418" y="240" width="164" height="56" rx="10"/>
  <text class="lbl mono" x="500" y="263" text-anchor="middle">pca.pkl</text>
  <text class="note" x="500" y="282" text-anchor="middle">PCA, 18 components</text>

  <rect class="b-gray" x="609" y="240" width="164" height="56" rx="10"/>
  <text class="lbl mono" x="691" y="263" text-anchor="middle">model.pkl</text>
  <text class="note" x="691" y="282" text-anchor="middle">random forest, 8 trees</text>

  <rect class="b-gray" x="800" y="240" width="164" height="56" rx="10"/>
  <text class="lbl mono" x="882" y="263" text-anchor="middle">scaler_y.pkl</text>
  <text class="note" x="882" y="282" text-anchor="middle">salary StandardScaler</text>

  <path class="edge" d="M309,296 V360" marker-end="url(#ah)"/>
  <path class="edge" d="M500,296 V360" marker-end="url(#ah)"/>
  <path class="edge" d="M691,296 V360" marker-end="url(#ah)"/>
  <path class="edge" d="M882,296 V360" marker-end="url(#ah)"/>
  <text class="elbl" x="317" y="318">pickle.load at startup</text>

  <!-- ===== Online: Flask app ===== -->
  <rect class="group" x="22" y="330" width="956" height="108" rx="12"/>
  <text class="glbl" x="38" y="351">APP.PY · FLASK · PORT 5000</text>

  <rect class="b-blue" x="36" y="364" width="164" height="60" rx="10"/>
  <text class="lbl mono" x="118" y="389" text-anchor="middle">GET /</text>
  <text class="note" x="118" y="409" text-anchor="middle">serves the input form</text>

  <rect class="b-blue" x="227" y="364" width="737" height="60" rx="10"/>
  <text class="lbl mono" x="595.5" y="389" text-anchor="middle">POST /predict</text>
  <text class="note" x="595.5" y="409" text-anchor="middle">one-hot → PCA → random forest → inverse-scale → salary</text>

  <!-- ===== Browser ===== -->
  <path class="edge" d="M118,424 V500" marker-end="url(#ah)"/>
  <text class="elbl" x="126" y="457">HTML page</text>
