  <text class="glbl" x="38" y="491">BROWSER</text>

  <rect class="b-orange" x="36" y="504" width="164" height="60" rx="10"/>
  <text class="lbl mono" x="118" y="529" text-anchor="middle">index.html</text>
  <text class="note" x="118" y="549" text-anchor="middle">8-field form + style.css</text>

  <rect class="b-orange" x="800" y="504" width="164" height="60" rx="10"/>
  <text class="lbl mono" x="882" y="529" text-anchor="middle">results.html</text>
  <text class="note" x="882" y="549" text-anchor="middle">shows the prediction</text>

  <path class="edge" d="M200,534 H500 V428" marker-end="url(#ah)"/>
  <text class="elbl" x="350" y="525" text-anchor="middle">HTTP POST · 8 form fields</text>
